<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teoria Musicale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#181824;--gold:#c8a96e;--gold2:rgba(200,169,110,.15);--text:#e2ddd5;--muted:#5a5870;--ok:#5aaf82;--ok2:rgba(90,175,130,.12);--err:#e06060;--err2:rgba(224,96,96,.12);--border:rgba(255,255,255,.06);--r:10px}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;padding-bottom:3rem}
.hdr{text-align:center;padding:2rem 1rem 1.5rem;border-bottom:.5px solid var(--border)}
.hdr h1{font-size:clamp(20px,5vw,28px);font-weight:300;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.hdr p{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:5px;font-family:'JetBrains Mono',monospace}
.wrap{max-width:560px;margin:0 auto;padding:0 1.25rem}
.stats{display:flex;gap:8px;margin:1.25rem 0}
.stat{flex:1;border-radius:var(--r);padding:10px 12px;text-align:center;border:.5px solid var(--border);background:var(--bg2)}
.stat.ok{background:var(--ok2);border-color:rgba(90,175,130,.25)}.stat.er{background:var(--err2);border-color:rgba(224,96,96,.25)}
.sl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:4px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.stat.ok .sl{color:var(--ok)}.stat.er .sl{color:var(--err)}
.sv{font-size:26px;font-weight:600;display:block;color:var(--text)}
.stat.ok .sv{color:var(--ok)}.stat.er .sv{color:var(--err)}
.sec{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:8px;margin-top:1.25rem;display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:.5px;background:var(--border)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:1rem}
.mb{padding:13px 10px;border:.5px solid rgba(255,255,255,.08);border-radius:var(--r);background:var(--bg2);color:#5a5870;cursor:pointer;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:13.5px;line-height:1.45;transition:all .2s}
.mb:hover{border-color:rgba(200,169,110,.35);color:var(--text)}
.mb.on{border:1.5px solid var(--gold);background:var(--gold2);color:var(--gold)}
.mn{font-size:9px;display:block;margin-bottom:3px;opacity:.4;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.dsp{background:var(--bg2);border:.5px solid var(--border);border-radius:14px;padding:2rem 1.5rem;min-height:130px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin-bottom:.75rem;transition:border-color .3s}
.dsp.dok{border-color:rgba(90,175,130,.6)}.dsp.der{border-color:rgba(224,96,96,.6)}
.dtag{font-size:9px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:12px}
.dq{font-size:clamp(17px,4vw,22px);line-height:1.55;font-weight:300}
.dq em{color:var(--gold);font-style:italic}
.fb{border-radius:var(--r);padding:9px 14px;font-size:13px;margin-bottom:.5rem;display:none;gap:8px;line-height:1.5}
.fb.fok{display:flex;background:var(--ok2);border:.5px solid rgba(90,175,130,.25);color:#8ed8b0}
.fb.fer{display:flex;background:var(--err2);border:.5px solid rgba(224,96,96,.25);color:#e89090}
.interim{font-size:12px;color:rgba(200,169,110,.7);font-style:italic;min-height:18px;margin-bottom:4px;font-family:'JetBrains Mono',monospace;text-align:center}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
#pov{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}
#pov.open{display:flex}
#pbox{background:linear-gradient(160deg,#0f0f18,#14140a);border:2px solid rgba(200,169,110,.45);border-radius:18px;padding:28px 24px;max-width:400px;width:100%;text-align:center}
#pbox .ico{font-size:52px;margin-bottom:14px}
#pbox h2{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px}
#pbox p{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:22px;font-family:'JetBrains Mono',monospace}
#perr{display:none;background:rgba(224,96,96,.1);border:.5px solid rgba(224,96,96,.3);border-radius:8px;padding:12px;font-size:12px;color:#fca5a5;line-height:1.6;margin-bottom:12px;text-align:left;font-family:'JetBrains Mono',monospace}
#pbtn{width:100%;border:none;border-radius:10px;background:linear-gradient(135deg,#c8a96e,#a07840);color:#0a0a0f;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:16px;cursor:pointer;margin-bottom:10px}
#pcan{width:100%;background:transparent;border:.5px solid rgba(100,100,120,.3);border-radius:8px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px;cursor:pointer}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:.85rem}
.micb{width:52px;height:52px;border-radius:50%;border:.5px solid rgba(255,255,255,.1);background:var(--bg3);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;transition:all .2s}
.micb:disabled{opacity:.3;cursor:not-allowed}
.micb.rec{border-color:var(--err);background:var(--err2);animation:pu .7s infinite}
.micb.ok2{border-color:var(--ok);background:var(--ok2)}
.mst{flex:1;font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.kbdb{width:44px;height:44px;border-radius:var(--r);border:.5px solid rgba(255,255,255,.08);background:var(--bg3);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.kbdb:disabled{opacity:.3;cursor:not-allowed}.kbdb.on{border-color:var(--gold);color:var(--gold);background:var(--gold2)}
.kbd{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:.85rem;display:none}
.kbd.open{display:block}
.kdisp{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:7px;padding:8px 12px;margin-bottom:12px;min-height:36px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text)}
.kdisp .ph{color:var(--muted);font-size:12px}
.krow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.rl{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.mk{padding:7px 11px;border:.5px solid rgba(255,255,255,.09);border-radius:6px;background:var(--bg3);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;cursor:pointer;transition:all .15s}
.mk:hover{border-color:rgba(200,169,110,.4);color:var(--gold)}
.mk.acc{color:var(--gold);font-size:16px}
.mk.send{font-size:11px;font-family:'JetBrains Mono',monospace;padding:7px 12px;background:var(--gold2);border-color:rgba(200,169,110,.4);color:var(--gold)}
.mk.clr{font-size:11px;font-family:'JetBrains Mono',monospace;padding:7px 10px;color:var(--muted)}
.ksep{height:.5px;background:var(--border);margin:8px 0}
.btns{display:flex;gap:8px;margin-top:.5rem}
.rb{flex:1;padding:9px;border:.5px solid rgba(255,255,255,.07);border-radius:var(--r);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:'Cormorant Garamond',Georgia,serif;transition:all .2s}
.rb:hover{border-color:var(--gold);color:var(--gold)}.rb:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body>
<div id="pov"><div id="pbox">
  <div class="ico">🎙</div>
  <h2>Attiva il Microfono</h2>
  <p>Il browser chiederà il permesso.<br>Premi <strong style="color:var(--gold)">Consenti</strong> quando appare il popup.</p>
  <div id="perr"></div>
  <button id="pbtn" onclick="unlockAudio();reqMic()">🎙 ATTIVA MICROFONO</button>
  <button id="pcan" onclick="closeP()">✕ ANNULLA</button>
</div></div>

<div class="hdr"><h1>♩ Teoria Musicale</h1><p>Allenamento interattivo</p></div>
<div class="wrap">
  <div class="stats">
    <div class="stat ok"><span class="sl">Corrette</span><span class="sv" id="sc">0</span></div>
    <div class="stat er"><span class="sl">Sbagliate</span><span class="sv" id="sw">0</span></div>
    <div class="stat"><span class="sl">Totale</span><span class="sv" id="st">0</span></div>
  </div>
  <div class="sec">modalità</div>
  <div class="mgrid">
    <button class="mb" onclick="setMode('scale',this)"><span class="mn">01</span>Scale Maggiori</button>
    <button class="mb" onclick="setMode('gradi',this)"><span class="mn">02</span>Gradi della Scala</button>
    <button class="mb" onclick="setMode('arm',this)"><span class="mn">03</span>Scala Armonizzata</button>
    <button class="mb" onclick="setMode('dom',this)"><span class="mn">04</span>Dominante Secondaria</button>
    <button class="mb" onclick="setMode('251',this)"><span class="mn">05</span>2 — 5 — 1</button>
    <button class="mb" onclick="setMode('251s',this)"><span class="mn">06</span>2 — 5 — 1 Secondari</button>
    <button class="mb" onclick="setMode('voic',this)" style="grid-column:1/-1"><span class="mn">07</span>Voicing senza Tonica (A &amp; B)</button>
    <button class="mb" onclick="setMode('altn',this)" style="grid-column:1/-1"><span class="mn">08</span>Note Alterate delle Scale</button>
  </div>
  <div class="dsp" id="dsp"><span class="dtag" id="dtag">Seleziona una modalità</span><p class="dq" id="dq">Scegli una modalità per iniziare</p></div>
  <div class="fb" id="fb"><svg id="fbico" width="14" height="14" viewBox="0 0 14 14" fill="none"></svg><span id="fbtxt"></span></div>
  <div class="interim" id="interim"></div>
  <div class="mrow">
    <button class="micb" id="micb" onclick="unlockAudio();micClick()" disabled>🎙</button>
    <div class="mst" id="mst">In attesa...</div>
    <button class="kbdb" id="kbdb" onclick="togKbd()" disabled>
      <svg width="20" height="16" viewBox="0 0 20 16" fill="none"><rect x="1" y="1" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.2"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="8" cy="6" r="1" fill="currentColor"/><circle cx="11.5" cy="6" r="1" fill="currentColor"/><circle cx="15" cy="6" r="1" fill="currentColor"/><rect x="6" y="9.5" width="8" height="1.5" rx=".75" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="kbd" id="kbd">
    <div class="kdisp"><span id="kval" class="ph">tocca i tasti...</span><svg onclick="kClr()" id="kx" style="cursor:pointer;margin-left:auto;flex-shrink:0;display:none" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#e06060" stroke-width="1"/><line x1="4.5" y1="4.5" x2="9.5" y2="9.5" stroke="#e06060" stroke-width="1.2" stroke-linecap="round"/><line x1="9.5" y1="4.5" x2="4.5" y2="9.5" stroke="#e06060" stroke-width="1.2" stroke-linecap="round"/></svg></div>
    <div class="rl">Qualità accordo</div>
    <div class="krow">
      <button class="mk" onclick="kType('maj7')">maj7</button>
      <button class="mk" onclick="kType('min7')">min7</button>
      <button class="mk" onclick="kType('7')">7</button>
      <button class="mk" onclick="kType('m7b5')">m7b5</button>
    </div>
    <div class="ksep"></div>
    <div class="rl">Alterazioni</div><div class="krow" id="knums"></div>
    <div class="ksep"></div>
    <div class="rl">Note</div><div class="krow" id="knotes"></div>
    <div class="krow" style="margin-top:4px">
      <button class="mk acc" onclick="kAcc('#')">#</button>
      <button class="mk acc" onclick="kAcc('b')">♭</button>
      <button class="mk clr" onclick="kBack()">⌫</button>
      <button class="mk clr" onclick="kClr()">cancella</button>
      <button class="mk send" onclick="kSend()">invio ↩</button>
    </div>
  </div>
  <div class="btns">
    <button class="rb" id="brep" onclick="repQ()" disabled>🔊 Domanda</button>
    <button class="rb" id="bris" onclick="unlockAudio();micClick()" disabled>🎤 Rispondi</button>
    <button class="rb" id="bskp" onclick="skpQ()" disabled>→ Salta</button>
    <button class="rb" id="bsho" onclick="shoA()" disabled>● Risposta</button>
  </div>
</div>

<script>
'use strict';

// ── DATI ──
const SN = {
  'Do':  ['Do','Re','Mi','Fa','Sol','La','Si'],
  'Reb': ['Reb','Mib','Fa','Solb','Lab','Sib','Do'],
  'Re':  ['Re','Mi','Solb','Sol','La','Si','Reb'],
  'Mib': ['Mib','Fa','Sol','Lab','Sib','Do','Re'],
  'Mi':  ['Mi','Solb','Lab','La','Si','Reb','Mib'],
  'Fa':  ['Fa','Sol','La','Sib','Do','Re','Mi'],
  'Solb':['Solb','Lab','Sib','Dob','Reb','Mib','Fa'],
  'Sol': ['Sol','La','Si','Do','Re','Mi','Solb'],
  'Lab': ['Lab','Sib','Do','Reb','Mib','Fa','Sol'],
  'La':  ['La','Si','Reb','Re','Mi','Solb','Lab'],
  'Sib': ['Sib','Do','Re','Mib','Fa','Sol','La'],
  'Si':  ['Si','Reb','Mib','Mi','Solb','Lab','Sib'],
};
// Note alterate per scala (notazione tradizionale)
const SCALE_ALT_NOTES = {
  'Do':  [],
  'Reb': ['reb','mib','solb','lab','sib'],
  'Re':  ['fa#','do#'],
  'Mib': ['mib','lab','sib'],
  'Mi':  ['fa#','do#','sol#','re#'],
  'Fa':  ['sib'],
  'Solb':['solb','lab','sib','reb','mib','dob'],
  'Sol': ['fa#'],
  'Lab': ['sib','mib','lab','reb'],
  'La':  ['fa#','do#','sol#'],
  'Sib': ['sib','mib'],
  'Si':  ['fa#','do#','sol#','re#','la#'],
};
const ST = {'Do':'','Reb':'bemolli','Re':'diesis','Mib':'bemolli','Mi':'diesis','Fa':'bemolle','Solb':'bemolli','Sol':'diesis','Lab':'bemolli','La':'diesis','Sib':'bemolli','Si':'diesis'};
const GN = ['I','II','III','IV','V','VI','VII'];
const GA = ['maj7','min7','min7','maj7','7','min7','m7b5'];
const VAB = {
  'maj7':{A:'3ª — 7ª — 9ª — 5ª',B:'7ª — 3ª — 13ª — 9ª'},
  'min7':{A:'3ªm — 7ªm — 9ª — 11ª',B:'7ªm — 3ªm — 11ª — 5ª'},
  'dom7':{A:'3ª — 7ªm — 9ª — 13ª',B:'7ªm — 3ª — 13ª — 9ª'}
};
function arm(t){return SN[t].map((n,i)=>n+GA[i]).join(' — ');}
function dom(t,g){return SN[t][(g+4)%7]+'7';}
function t251(t,g){const n=SN[t],c=GA;return n[(g+1)%7]+c[(g+1)%7]+' — '+n[(g+4)%7]+'7 — '+n[g]+c[g];}

// ── NORMALIZZAZIONE ──
// Converte qualsiasi forma parlata/scritta in token uniformi
function N(s){
  let t = s.toLowerCase()
    // note con bemolle scritte separate → token unico
    .replace(/sol\s*b(emolle)?/g,'solb')
    .replace(/re\s*b(emolle)?/g,'reb')
    .replace(/mi\s*b(emolle)?/g,'mib')
    .replace(/la\s*b(emolle)?/g,'lab')
    .replace(/si\s*b(emolle)?/g,'sib')
    .replace(/do\s*b(emolle)?/g,'dob')
    .replace(/fa\s*b(emolle)?/g,'fab')
    // tipo alterazione → token
    .replace(/bemolli/g,' bemolli ')
    .replace(/bemolle/g,' bemolle ')
    .replace(/diesis/g,' diesis ')
    // sinonimi bemollo
    .replace(/bemollo/g,' bemolle ')
    // parole inutili
    .replace(/maggiore/g,' ')
    .replace(/nessuna\s*alterazione/g,' zero ')
    .replace(/nessuno/g,' zero ')
    .replace(/niente/g,' zero ')
    .replace(/♭/g,'b');
  // numeri → cifre
  const nm={'zero':'0','uno':'1','una':'1','due':'2','tre':'3','tré':'3','quattro':'4','cinque':'5','sei':'6','sette':'7'};
  for(const[w,n]of Object.entries(nm)) t=t.replace(new RegExp('(^|\\s)'+w+'(\\s|$)','g'),' '+n+' ');
  // rimuovi tutto tranne lettere cifre spazi
  t=t.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  return t;
}

// Confronto: ogni token della risposta corretta deve essere
// presente come parola intera nella risposta dell'utente
function match(correct, ans){
  const tc = N(correct).split(/\s+/).filter(w=>w.length>0);
  const ta = ' '+N(ans)+' ';
  return tc.length>0 && tc.every(w=>ta.includes(' '+w+' '));
}

// ── STATO ──
let mode=null,Q=null,sc=0,sw=0,queue=[],micOK=false,kOpen=false,kBuf='',mSt='idle';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;

function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

// ── MICROFONO (dal rapportino) ──
let pRec=null,pCb=null,pTim=null;

function listenOnce(onR,onI,onE){
  if(!SR){if(onE)onE('ns');return;}
  if(pRec){try{pRec.abort();}catch(e){}pRec=null;}
  clearTimeout(pTim);
  pCb={onR,onI,onE};
  setTimeout(()=>{
    if(!pCb)return;
    const rec=new SR();
    rec.lang='it-IT';rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=1;
    pRec=rec;let done=false,acc='';
    function deliver(txt){
      if(done)return;done=true;clearTimeout(pTim);pRec=null;
      try{rec.abort();}catch(e){}
      const cb=pCb;pCb=null;if(!cb)return;
      const c=txt.trim();if(c)cb.onR(c);else if(cb.onE)cb.onE('empty');
    }
    rec.onresult=e=>{
      if(pDeaf){deliver('');return;}
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)acc+=e.results[i][0].transcript+' ';
        else interim=e.results[i][0].transcript;
      }
      if(pCb&&pCb.onI)pCb.onI((acc+interim).trim());
      if(acc.trim()){clearTimeout(pTim);pTim=setTimeout(()=>deliver(acc.trim()),2000);}
    };
    rec.onerror=e=>{
      pRec=null;
      if(e.error==='not-allowed'||e.error==='permission-denied'){micOK=false;if(pCb&&pCb.onE)pCb.onE('denied');pCb=null;return;}
      if(!done)deliver(acc.trim());
    };
    rec.onend=()=>{
      pRec=null;if(done)return;
      if(pCb){
        const r2=new SR();r2.lang='it-IT';r2.continuous=false;r2.interimResults=true;pRec=r2;
        r2.onresult=rec.onresult;
        r2.onerror=()=>{pRec=null;if(!done)deliver(acc.trim());};
        r2.onend=()=>{pRec=null;if(!done)deliver(acc.trim());};
        try{r2.start();}catch(e){if(!done)deliver(acc.trim());}
      }else deliver(acc.trim());
    };
    try{rec.start();}catch(e){pRec=null;if(pCb&&pCb.onE){pCb.onE('err');pCb=null;}}
    pTim=setTimeout(()=>deliver(acc.trim()),15000);
  },200);
}
function stopRec(){clearTimeout(pTim);pCb=null;if(pRec){try{pRec.abort();}catch(e){}pRec=null;}}

// ── AUDIO UNLOCK ──
let actx=null;
function unlockAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function ding(ok){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended'){actx.resume().then(()=>_ding(ok));return;}
    _ding(ok);
  }catch(e){}
}
function _ding(ok){
  const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime;
  if(ok){o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.12);o.frequency.setValueAtTime(784,t+.24);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);}
  else{o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(196,t+.15);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4);}
}

// ── TTS ──
let bv=null;
function bestVoice(){
  if(bv)return bv;const vv=speechSynthesis.getVoices();if(!vv.length)return null;
  const pp=[v=>v.name==='Google italiano',v=>/google/i.test(v.name)&&/it/i.test(v.lang),v=>/it[-_]IT/i.test(v.lang)&&!v.localService,v=>/it/i.test(v.lang)];
  for(const p of pp){const f=vv.find(p);if(f){bv=f;return f;}}return null;
}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{bv=null;};
let pDeaf=false, pDeafTimer=null;
function setDeaf(v){
  clearTimeout(pDeafTimer);
  pDeaf=v;
  if(v) pDeafTimer=setTimeout(()=>{pDeaf=false;},8000); // sicurezza: reset dopo 8s
}

function speak(txt,cb){
  if(!('speechSynthesis'in window)){if(cb)setTimeout(cb,100);return;}
  try{
    speechSynthesis.cancel();
    setDeaf(true);
    const u=new SpeechSynthesisUtterance(txt);u.lang='it-IT';u.rate=1.0;
    const v=bestVoice();if(v)u.voice=v;
    u.onend=()=>{setDeaf(false);if(cb)setTimeout(cb,700);};
    u.onerror=()=>{setDeaf(false);if(cb)setTimeout(cb,300);};
    speechSynthesis.speak(u);
  }catch(e){setDeaf(false);if(cb)setTimeout(cb,100);}
}

// ── PERMESSO MIC ──
async function reqMic(){
  const btn=document.getElementById('pbtn'),err=document.getElementById('perr');
  btn.textContent='⏳ Attendi...';btn.disabled=true;err.style.display='none';
  try{
    await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    micOK=true;closeP();startListen();
  }catch(e){
    micOK=false;btn.textContent='🎙 RIPROVA';btn.disabled=false;
    let m='';
    if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError')m='❌ Hai premuto Blocca. Clicca 🔒 nella barra → Microfono → Consenti → Ricarica.';
    else if(e.name==='NotFoundError')m='❌ Nessun microfono trovato.';
    else m='❌ '+e.name;
    err.innerHTML=m;err.style.display='block';
  }
}
function openP(){const btn=document.getElementById('pbtn'),err=document.getElementById('perr');btn.textContent='🎙 ATTIVA MICROFONO';btn.disabled=false;err.style.display='none';document.getElementById('pov').classList.add('open');}
function closeP(){document.getElementById('pov').classList.remove('open');}

// ── LOGICA DOMANDE ──
function setMode(m,el){
  mode=m;sc=sw=0;updStats();
  document.querySelectorAll('.mb').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  buildQ();nextQ();enCtrl(true);
}
function buildQ(){
  const keys=Object.keys(SN);
  switch(mode){
    case 'scale': queue=shuf(keys);break;
    case 'gradi': queue=shuf(keys.flatMap(k=>[0,1,2,3,4,5,6].map(g=>({k,g}))));break;
    case 'arm':   queue=shuf(keys);break;
    case 'dom':   queue=shuf(keys.flatMap(k=>[0,1,2,3,4,5,6].map(g=>({k,g}))));break;
    case '251':   queue=shuf(keys.flatMap(k=>[0,1,2,3,4,5,6].map(g=>({k,g}))));break;
    case '251s':  queue=shuf(keys.flatMap(k=>[0,1,2,3,4,5,6].map(g=>({k,g}))));break;
    case 'voic':  queue=shuf(['maj7','min7','dom7'].flatMap(t=>['A','B'].map(m=>({t,m}))));break;
    case 'altn':  queue=shuf(Object.keys(SN));break;
  }
}
function nextQ(){
  if(!queue.length)buildQ();
  Q=queue.shift();renderQ();clrFb();
  document.getElementById('dsp').classList.remove('dok','der');
  document.getElementById('interim').textContent='';
}
function renderQ(){
  const tag=document.getElementById('dtag'),q=document.getElementById('dq');
  switch(mode){
    case 'scale': tag.textContent='Scale maggiori';q.innerHTML=`Quante alterazioni ha <em>${Q}</em> maggiore e di che tipo?`;break;
    case 'gradi': tag.textContent='Gradi';q.innerHTML=`Scala di <em>${Q.k}</em> — qual è il <em>${GN[Q.g]}</em> grado?`;break;
    case 'arm':   tag.textContent='Scala armonizzata';q.innerHTML=`Armonizza <em>${Q}</em> maggiore`;break;
    case 'dom':   tag.textContent='Dominante secondaria';q.innerHTML=`Scala di <em>${Q.k}</em> — dom. secondaria del <em>${GN[Q.g]}</em> grado?`;break;
    case '251':   tag.textContent='2 — 5 — 1';q.innerHTML=`Scala di <em>${Q.k}</em> — 2-5-1 del <em>${GN[Q.g]}</em> grado`;break;
    case '251s':  tag.textContent='2 — 5 — 1 Secondari';q.innerHTML=`Scala di <em>${Q.k}</em> — 2-5-1 secondari del <em>${GN[Q.g]}</em> grado`;break;
    case 'voic':  tag.textContent='Voicing';q.innerHTML=`Voicing <em>Modello ${Q.m}</em> per accordo <em>${Q.t}</em>`;break;
    case 'altn':  tag.textContent='Note alterate';q.innerHTML=`Quali note sono alterate in <em>${Q}</em> maggiore?`;break;
  }
}
function getA(){
  switch(mode){
    case 'scale':
      const n=SA[Q],tp=ST[Q];
      if(n===0)return'nessuna alterazione';
      return n+' '+tp;
    case 'gradi': return SN[Q.k][Q.g];
    case 'arm':   return arm(Q);
    case 'dom':   return dom(Q.k,Q.g);
    case '251':   return t251(Q.k,Q.g);
    case '251s':  return[0,1,2,3,4,5,6].filter(x=>x!==Q.g).map(s=>GN[s]+': '+t251(Q.k,s)).join(' | ');
    case 'voic':  return VAB[Q.t][Q.m];
    case 'altn': {
      const notes = SCALE_ALT_NOTES[Q];
      return notes.length===0 ? 'nessuna alterazione' : notes.join(' ');
    }
  }
  return'';
}

function checkA(ans){
  if(!Q||!mode)return;
  stopRec();setMS('idle');
  const correct=getA();
  let ok;
  if(mode==='altn'){
    // per le note alterate l'ordine non conta
    const tc=N(correct).split(/\s+/).filter(w=>w.length>0);
    const ta=N(ans).split(/\s+/).filter(w=>w.length>0);
    // tutte le note corrette devono essere presenti e il numero deve coincidere
    ok = tc.length===ta.length && tc.every(w=>ta.includes(w));
    // oppure accetta anche se ci sono tutte (ordine diverso, parole extra tollerate)
    if(!ok) ok = tc.length>0 && tc.every(w=>(' '+N(ans)+' ').includes(' '+w+' '));
  } else {
    ok=match(correct,ans);
  }
  if(ok){sc++;ding(true);showFb(true,'Corretto! '+correct);document.getElementById('dsp').classList.add('dok');}
  else{sw++;ding(false);showFb(false,'Sbagliato. Risposta: '+correct);document.getElementById('dsp').classList.add('der');}
  updStats();
  setTimeout(()=>nextQ(),3000);
}

function showFb(ok,msg){
  const fb=document.getElementById('fb'),txt=document.getElementById('fbtxt'),ico=document.getElementById('fbico');
  fb.className='fb '+(ok?'fok':'fer');txt.textContent=msg;
  ico.innerHTML=ok?'<circle cx="7" cy="7" r="6" stroke="#5aaf82" stroke-width="1.2"/><polyline points="4,7 6.5,9.5 10,5" stroke="#5aaf82" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>':'<circle cx="7" cy="7" r="6" stroke="#e06060" stroke-width="1.2"/><line x1="4.5" y1="4.5" x2="9.5" y2="9.5" stroke="#e06060" stroke-width="1.3" stroke-linecap="round"/><line x1="9.5" y1="4.5" x2="4.5" y2="9.5" stroke="#e06060" stroke-width="1.3" stroke-linecap="round"/>';
}
function clrFb(){document.getElementById('fb').className='fb';}

// ── MIC ──
function micClick(){
  if(!SR){setSt('Browser non supportato');return;}
  if(mSt==='rec'){stopRec();setMS('idle');setSt('In attesa...');return;}
  if(!micOK){openP();return;}
  startListen();
}
function startListen(){
  if(!Q){setSt('Seleziona prima una modalità');return;}
  stopRec();
  setMS('rec');setSt('🔴 In ascolto...');
  document.getElementById('interim').textContent='';
  listenOnce(
    txt=>{document.getElementById('interim').textContent='';setMS('ok2');setSt('✅ '+txt);checkA(txt);},
    i=>{document.getElementById('interim').textContent=i;},
    e=>{setMS('idle');setSt(e==='denied'?'❌ Microfono bloccato — premi 🎙':'⚠️ Premi 🎙 per riprovare');}
  );
}
function setMS(s){mSt=s;const b=document.getElementById('micb');b.className='micb '+s;b.textContent={idle:'🎙',rec:'⏹',ok2:'✓'}[s]||'🎙';}
function setSt(t){document.getElementById('mst').textContent=t;}
function repQ(){if('speechSynthesis'in window)speechSynthesis.cancel();speak(document.getElementById('dq').innerText,()=>{});}
function skpQ(){stopRec();if('speechSynthesis'in window)speechSynthesis.cancel();nextQ();}
function shoA(){if(Q)showFb(false,'Risposta: '+getA());}

// ── TASTIERA ──
function initKbd(){
  ['Do','Re','Mi','Fa','Sol','La','Si'].forEach(n=>{const b=document.createElement('button');b.className='mk';b.textContent=n;b.onclick=()=>kType(n);document.getElementById('knotes').appendChild(b);});
  ['0','1','2','3','4','5','6','7'].forEach(n=>{const b=document.createElement('button');b.className='mk';b.textContent=n;b.onclick=()=>kType(n);document.getElementById('knums').appendChild(b);});
}
function togKbd(){kOpen=!kOpen;document.getElementById('kbd').classList.toggle('open',kOpen);document.getElementById('kbdb').classList.toggle('on',kOpen);}
function kType(c){kBuf+=(kBuf&&!kBuf.endsWith(' ')&&c!=='b'?' ':'')+c;updK();}
function kAcc(c){kBuf=kBuf.trimEnd()+c;updK();}
function kBack(){const p=kBuf.trimEnd().split(' ');p.pop();kBuf=p.join(' ');updK();}
function kClr(){kBuf='';updK();}
function kSend(){if(!kBuf.trim())return;checkA(kBuf);kBuf='';updK();}
function updK(){const el=document.getElementById('kval'),x=document.getElementById('kx');if(kBuf){el.textContent=kBuf;el.classList.remove('ph');x.style.display='block';}else{el.textContent='tocca i tasti...';el.classList.add('ph');x.style.display='none';}}

function updStats(){document.getElementById('sc').textContent=sc;document.getElementById('sw').textContent=sw;document.getElementById('st').textContent=sc+sw;}
function enCtrl(on){['micb','kbdb','brep','bris','bskp','bsho'].forEach(id=>document.getElementById(id).disabled=!on);}

initKbd();
if(location.protocol==='file:'){
  const d=document.createElement('div');
  d.style='background:rgba(224,96,96,.1);border:1px solid rgba(224,96,96,.3);border-radius:10px;padding:14px;margin:1.25rem 0;font-family:JetBrains Mono,monospace;font-size:12px;color:#fca5a5;line-height:1.9';
  d.innerHTML='⚠️ <strong style="color:#e06060">Microfono non disponibile</strong> — apri da file://<br>Soluzione: apri PowerShell → <code style="background:rgba(255,255,255,.08);padding:1px 6px;border-radius:3px">python -m http.server 8080</code><br>poi vai su <strong style="color:#5aaf82">http://localhost:8080/music_trainer.html</strong>';
  document.querySelector('.wrap').insertBefore(d,document.querySelector('.stats'));
}
